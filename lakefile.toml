name = "hex-graph-iso"
defaultTargets = ["HexGraph", "HexGraphIso"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexBasic"
git = "https://github.com/leanprover/hex-basic.git"
rev = "a47240943e925951a676d1a1c2f2a615ae68fdef"

[[require]]
name = "HexMatrix"
git = "https://github.com/leanprover/hex-matrix.git"
rev = "a99dc4690f411538088463b6db94e38958e65a81"

[[lean_lib]]
name = "HexGraph"

[[lean_lib]]
name = "HexGraphIso"
precompileModules = true

[[lean_lib]]
name = "HexGraphIsoTests"
globs = ["HexGraphIso.TacticTests", "HexGraphIso.ModuleBoundaryTests", "HexGraphIso.TestGraphs"]
