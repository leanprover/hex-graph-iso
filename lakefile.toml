name = "hex-graph-iso"
defaultTargets = ["HexGraphIso"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexBasic"
git = "https://github.com/leanprover/hex-basic.git"
rev = "v0.8.0"

[[require]]
name = "HexMatrix"
git = "https://github.com/leanprover/hex-matrix.git"
rev = "v0.8.0"

[[require]]
name = "HexPermGroup"
git = "https://github.com/leanprover/hex-perm-group.git"
rev = "v0.8.0"

[[lean_lib]]
name = "HexGraphIso"

[[lean_lib]]
name = "HexGraph"

[[lean_lib]]
name = "HexGraphIsoTests"
globs = ["HexGraphIso.TestGraphs", "HexGraphIso.TacticTests", "HexGraphIso.ModuleBoundaryTests", "HexGraphIso.SparseTests"]
