name = "hex-graph-iso"
defaultTargets = ["HexGraph", "HexGraphIso"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexBasic"
git = "https://github.com/leanprover/hex-basic.git"
rev = "1a0fff2c8f545753b01cff0d941bf48f945cd299"

[[require]]
name = "HexMatrix"
git = "https://github.com/leanprover/hex-matrix.git"
rev = "f857b2b4495dc8d9ba6583d559d2b885ccbf40fc"

[[lean_lib]]
name = "HexGraph"

[[lean_lib]]
name = "HexGraphIso"
precompileModules = true

[[lean_lib]]
name = "HexGraphIsoTests"
globs = ["HexGraphIso.TacticTests", "HexGraphIso.ModuleBoundaryTests", "HexGraphIso.TestGraphs"]
