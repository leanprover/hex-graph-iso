name = "hex-graph-iso"
defaultTargets = ["HexGraph", "HexGraphIso"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexBasic"
git = "https://github.com/leanprover/hex-basic.git"
rev = "da8a864cd17ccca780d8c76af403e88585bc4734"

[[require]]
name = "HexMatrix"
git = "https://github.com/leanprover/hex-matrix.git"
rev = "25cfbbd8a689eb782fad408c46a9c1796dd943b2"

[[lean_lib]]
name = "HexGraph"

[[lean_lib]]
name = "HexGraphIso"

[[lean_lib]]
name = "HexGraphIsoTests"
globs = ["HexGraphIso.TacticTests"]
