name = "hex-graph-iso"
defaultTargets = ["HexGraph", "HexGraphIso"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexBasic"
git = "https://github.com/leanprover/hex-basic.git"
rev = "v0.3.0"

[[require]]
name = "HexMatrix"
git = "https://github.com/leanprover/hex-matrix.git"
rev = "v0.3.0"

[[lean_lib]]
name = "HexGraph"

[[lean_lib]]
name = "HexGraphIso"
precompileModules = true

[[lean_lib]]
name = "HexGraphIsoTests"
globs = ["HexGraphIso.TestGraphs", "HexGraphIso.TacticTests", "HexGraphIso.ModuleBoundaryTests"]
