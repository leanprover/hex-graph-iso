name = "hex-graph-iso-conformance"
defaultTargets = [
  "HexGraphIsoConformance",
  "hexgraphiso_emit_fixtures",
  "hexgraphiso_emit_campaign",
]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexGraphIso"
path = ".."

[[require]]
name = "hex-test-kit"
git = "https://github.com/leanprover/hex-test-kit.git"
rev = "a0373f12a85ff47e37bf6662c505c02ce3039a6c"

[[lean_lib]]
name = "HexGraphIsoConformance"
globs = ["HexGraphIso.Conformance"]

[[lean_exe]]
name = "hexgraphiso_emit_fixtures"
root = "HexGraphIso.EmitFixtures"

[[lean_exe]]
name = "hexgraphiso_emit_campaign"
root = "HexGraphIso.EmitCampaign"
